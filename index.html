<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remnants of a New World</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css?v=5" />
  <link rel="stylesheet" href="css/stage.css?v=5" />
  <link rel="stylesheet" href="css/opening.css?v=5" />
  <link rel="stylesheet" href="css/map.css?v=5" />
  <link rel="stylesheet" href="css/study.css?v=5" />
  <link rel="stylesheet" href="css/levels.css?v=5" />
  <link rel="stylesheet" href="css/reveal.css?v=5" />
  <link rel="stylesheet" href="css/weather-growth.css?v=5" />
  <link rel="stylesheet" href="css/warp.css?v=5" />
  <link rel="stylesheet" href="css/end.css?v=5" />
</head>
<body class="locked mood-science">
  <div id="stage" aria-hidden="true">
    <div class="paper-wash"></div>
    <div class="grid"></div>
    <div class="dust"></div>
    <div class="helix" id="helix"></div>
    <div class="notes" id="notes"></div>
    <div class="threads" id="threads"></div>
    <div class="orbit"></div>
  </div>

  <button id="sound-toggle" type="button" aria-pressed="false">Sound: Off</button>
  <audio id="bg-track" src="assets/audio/only-you.mp3" loop preload="auto"></audio>
  <div id="rail" aria-hidden="true"></div>

  <section id="opening">
    <div class="g-home">
      <div class="g-logo" aria-label="Remnants">
        <span class="c1">R</span><span class="c2">e</span><span class="c3">m</span><span class="c4">n</span><span class="c5">a</span><span class="c6">n</span><span class="c1">t</span><span class="c2">s</span>
      </div>
      <form id="search-form" action="#" autocomplete="off">
        <input id="search-q" type="search" value="Remnants of a New World" aria-label="Search" />
        <div class="g-btns">
          <button class="g-btn" id="begin" type="submit" name="search" value="1">Search</button>
          <button class="g-btn" id="lucky" type="submit" name="lucky" value="1">I'm Feeling Lucky</button>
        </div>
        <p id="search-note" hidden>Searching…</p>
      </form>
    </div>
  </section>
  <div class="mc-toast" id="mc-toast" aria-hidden="true">
    <div class="icon"></div>
    <div>
      <div class="t2">The End?</div>
    </div>
  </div>

  <div id="note-reader" role="dialog" aria-label="Note" hidden>
    <div class="nr-card"><p class="nr-text"></p><span class="nr-count"></span></div>
  </div>

  <main id="journey" aria-label="Journey"></main>

  <button id="map-btn" type="button" aria-label="Open chart" title="Chart"></button>
  <aside id="chart" aria-hidden="true">
    <div class="chart-bar">
      <span>chart://remnants/map</span>
      <button type="button" id="chart-close" style="color:#fff;font:12px Tahoma">×</button>
    </div>
    <div class="chart-scroll">
      <svg id="chart-svg" viewBox="0 0 360 360" role="img" aria-label="Journey maze map"></svg>
    </div>
    <div class="legend">
      <i><b class="lg lg-visited"></b>visited</i>
      <i><b class="lg lg-next"></b>one step away</i>
      <i><b class="lg lg-off"></b>off your route</i>
      <i><b class="lg lg-stop"></b>note stop</i>
      <i><b class="lg lg-dead">×</b>dead end</i>
      <i><b class="lg lg-you"></b>you</i>
    </div>
    <div class="you">You are at: <b id="chart-here">—</b></div>
    <div class="chart-msg" id="chart-msg"></div>
  </aside>

  <!-- Classic scripts share one global scope and must load in this order;
       boot.js runs last and wires everything up. -->
  <script src="js/content/content.js?v=5"></script>
  <script src="js/content/reflection.js?v=5"></script>
  <script src="js/world/slides.js?v=5"></script>
  <script src="js/game/state.js?v=5"></script>
  <script src="js/game/map.js?v=5"></script>
  <script src="js/world/audio.js?v=5"></script>
  <script src="js/world/atmosphere.js?v=5"></script>
  <script src="js/game/gates.js?v=5"></script>
  <script src="js/game/levels.js?v=5"></script>
  <script src="js/game/progress.js?v=5"></script>
  <script src="js/world/study.js?v=5"></script>
  <script src="js/world/journey.js?v=5"></script>
  <script src="js/boot.js?v=5"></script>
</body>
</html>
